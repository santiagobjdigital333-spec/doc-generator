<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#ffffff">
    <title>Shazan</title>

    <!-- Favicon: raio branco sobre quadrado azul (SVG inline, sem arquivo externo) -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23155EEF'/%3E%3Cpath transform='translate(4 4)' d='M13 2 3 14h9l-1 8 10-12h-9l1-8z' fill='%23fff' stroke='%23fff' stroke-width='1.5' stroke-linejoin='round'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

    <style>
        .opaco {
            opacity: .9;
            filter: blur(.4px) contrast(.95)
        }
    </style>

    <style>
        /* ==========================================================================
       SHAZAN — estilos
       --------------------------------------------------------------------------
       Índice
         1. Camadas
         2. Tokens de design
         3. Reset
         4. Base
         5. Layout (app shell)
         6. Componentes
            6.1 Ícones e bandeiras
            6.2 Botão de ícone
            6.3 Marca
            6.4 Sidebar
            6.5 Busca
            6.6 Navegação
            6.7 Backdrop (drawer mobile)
            6.8 Topbar
            6.9 Placeholder de conteúdo
            6.10 Visão de documento (cabeçalho, aviso, painéis, legenda)
            6.11 Cartão esquemático (.idcard)
         7. Utilitários
         8. Preferências do usuário

       Convenções
         - Nomes em BEM (.bloco__elemento--modificador); estado via atributos
           ARIA ([aria-current], [aria-expanded]) ou classes .is-* no <body>.
         - Toda cor, raio, sombra e duração sai dos tokens (seção 2).
         - A ordem das camadas abaixo decide a precedência — não a especificidade.
           Cada componente carrega o próprio responsivo, logo abaixo dele.
         - Breakpoint único do shell: 1024px (abaixo disso a sidebar vira drawer).
       ========================================================================== */

        /* 1. Camadas ============================================================== */
        @layer reset, tokens, base, layout, components, utilities, preferences;

        /* 2. Tokens de design ===================================================== */
        @layer tokens {
            :root {
                /* Cinzas (frios, puxados para o azul) */
                --gray-25: #fcfcfd;
                --gray-50: #f9fafb;
                --gray-100: #f2f4f7;
                --gray-200: #eaecf0;
                --gray-300: #d0d5dd;
                --gray-400: #98a2b3;
                --gray-500: #667085;
                --gray-600: #475467;
                --gray-700: #344054;
                --gray-800: #1d2939;
                --gray-900: #101828;

                /* Azuis */
                --blue-25: #f5f8ff;
                --blue-50: #eff4ff;
                --blue-100: #d1e0ff;
                --blue-200: #b2ccff;
                --blue-300: #84adff;
                --blue-400: #528bff;
                --blue-500: #2970ff;
                --blue-600: #155eef;
                --blue-700: #004eeb;
                --blue-800: #0040c1;

                /* Semânticos */
                --bg: var(--gray-50);
                --surface: #fff;
                --border: var(--gray-200);
                --border-strong: var(--gray-300);
                --text: var(--gray-900);
                --text-soft: var(--gray-700);
                --text-muted: var(--gray-500);
                --accent: var(--blue-600);
                --accent-soft: var(--blue-50);
                --ring: rgb(41 112 255 / .22);
                --scrim: rgb(16 24 40 / .48);

                /* Tipografia */
                --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI",
                    Roboto, "Helvetica Neue", Arial, sans-serif;
                --text-2xs: .6875rem;
                /* 11px */
                --text-xs: .75rem;
                /* 12px */
                --text-sm: .8125rem;
                /* 13px */
                --text-md: .875rem;
                /* 14px */
                --text-lg: .9375rem;
                /* 15px */
                --text-xl: 1.0625rem;
                /* 17px */

                /* Raios */
                --radius-xs: 3px;
                --radius-sm: 6px;
                --radius-md: 8px;
                --radius-lg: 12px;
                --radius-full: 999px;

                /* Sombras */
                --shadow-xs: 0 1px 2px rgb(16 24 40 / .05);
                --shadow-sm: 0 1px 3px rgb(16 24 40 / .10), 0 1px 2px rgb(16 24 40 / .06);
                --shadow-drawer: 0 24px 48px -12px rgb(16 24 40 / .22), 0 0 0 1px rgb(16 24 40 / .04);

                /* Movimento */
                --ease-out: cubic-bezier(.22, 1, .36, 1);
                --dur-fast: .12s;
                --dur: .18s;
                --dur-slow: .32s;

                /* Layout */
                --sidebar-w: 17.5rem;
                --drawer-w: min(20rem, calc(100vw - 3.5rem));
                --topbar-h: 3.75rem;
                --gutter: 1.5rem;

                /* Empilhamento */
                --z-topbar: 10;
                --z-backdrop: 30;
                --z-sidebar: 40;
            }

            @media (max-width: 1023.98px) {
                :root {
                    --topbar-h: 3.5rem;
                    --gutter: 1rem;
                }
            }
        }

        /* 3. Reset ================================================================ */
        @layer reset {

            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            * {
                margin: 0;
            }

            html {
                -webkit-text-size-adjust: 100%;
                text-size-adjust: 100%;
                -webkit-tap-highlight-color: transparent;
            }

            svg,
            img {
                display: block;
                max-width: 100%;
            }

            button,
            input,
            select,
            textarea {
                font: inherit;
                color: inherit;
                letter-spacing: inherit;
            }

            button {
                padding: 0;
                background: none;
                border: 0;
                cursor: pointer;
            }

            a {
                color: inherit;
                text-decoration: none;
            }

            ul[role="list"] {
                padding: 0;
                list-style: none;
            }

            h1,
            h2,
            h3,
            h4 {
                font-size: inherit;
                font-weight: inherit;
            }

            [hidden] {
                display: none !important;
            }
        }

        /* 4. Base ================================================================= */
        @layer base {
            html {
                font-family: var(--font-sans);
                line-height: 1.5;
                color: var(--text);
                background: var(--bg);
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                text-rendering: optimizeLegibility;
            }

            body {
                min-height: 100vh;
                min-height: 100dvh;
                font-size: var(--text-md);
            }

            :focus-visible {
                outline: 2px solid var(--blue-500);
                outline-offset: 2px;
            }

            ::selection {
                color: var(--blue-800);
                background: var(--blue-100);
            }

            mark {
                padding: 0 1px;
                margin: 0 -1px;
                color: var(--blue-800);
                background: var(--blue-100);
                border-radius: var(--radius-xs);
            }
        }

        /* 5. Layout (app shell) =================================================== */
        @layer layout {
            .app {
                display: grid;
                grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
                min-height: 100vh;
                min-height: 100dvh;
            }

            .main {
                display: flex;
                flex-direction: column;
                min-width: 0;
            }

            .content {
                flex: 1;
                width: 100%;
                padding: var(--gutter);
                padding-bottom: max(var(--gutter), env(safe-area-inset-bottom));
                outline: none;
            }

            @media (max-width: 1023.98px) {
                .app {
                    grid-template-columns: minmax(0, 1fr);
                }

                /* Trava a rolagem da página enquanto o drawer está aberto */
                body.is-nav-open {
                    overflow: hidden;
                }
            }
        }

        /* 6. Componentes ========================================================== */
        @layer components {

            /* 6.1 Ícones e bandeiras ---------------------------------------------- */
            .sprite {
                /* display:none quebraria referências internas do sprite em alguns browsers */
                position: absolute;
                width: 0;
                height: 0;
                overflow: hidden;
            }

            .icon {
                flex: none;
                width: 1.25rem;
                height: 1.25rem;
                fill: none;
                stroke: currentColor;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-linejoin: round;
            }

            .icon--solid {
                fill: currentColor;
                stroke-width: 1.5;
                /* o traço só arredonda as pontas do preenchimento */
            }

            .flag {
                --flag-w: 20px;
                position: relative;
                flex: none;
                display: block;
                width: var(--flag-w);
                aspect-ratio: 10 / 7;
                overflow: hidden;
                border-radius: var(--radius-xs);
            }

            .flag::after {
                /* contorno interno: separa a bandeira de fundos claros */
                content: "";
                position: absolute;
                inset: 0;
                border-radius: inherit;
                box-shadow: inset 0 0 0 1px rgb(16 24 40 / .12);
            }

            .flag__img {
                width: 100%;
                height: 100%;
            }

            .flag--lg {
                --flag-w: 44px;
                border-radius: 5px;
                box-shadow: var(--shadow-sm);
            }

            /* 6.2 Botão de ícone --------------------------------------------------- */
            .icon-btn {
                flex: none;
                display: inline-grid;
                place-items: center;
                width: 2.25rem;
                height: 2.25rem;
                color: var(--gray-600);
                border-radius: var(--radius-md);
                transition: color var(--dur), background-color var(--dur);
            }

            .icon-btn:hover {
                color: var(--gray-800);
                background: var(--gray-100);
            }

            .icon-btn:active {
                background: var(--gray-200);
            }

            /* 6.3 Marca ------------------------------------------------------------- */
            .brand {
                display: inline-flex;
                align-items: center;
                gap: .625rem;
                min-width: 0;
                user-select: none;
            }

            .brand__mark {
                flex: none;
                display: grid;
                place-items: center;
                width: 2rem;
                height: 2rem;
                color: #fff;
                background: linear-gradient(180deg, var(--blue-500), var(--blue-700));
                border-radius: 9px;
                box-shadow:
                    inset 0 1px 0 rgb(255 255 255 / .24),
                    inset 0 0 0 1px rgb(16 24 40 / .08),
                    0 1px 2px rgb(16 24 40 / .20);
            }

            .brand__mark .icon {
                width: 1.0625rem;
                height: 1.0625rem;
            }

            .brand__name {
                font-size: var(--text-xl);
                font-weight: 700;
                letter-spacing: -.015em;
                line-height: 1;
                color: var(--gray-900);
            }

            /* 6.4 Sidebar ----------------------------------------------------------- */
            .sidebar {
                position: sticky;
                top: 0;
                display: flex;
                flex-direction: column;
                height: 100vh;
                height: 100dvh;
                background: var(--surface);
                border-right: 1px solid var(--border);
            }

            .sidebar__header {
                flex: none;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: .5rem;
                height: var(--topbar-h);
                /* alinha com a topbar */
                padding: 0 .75rem 0 1.25rem;
            }

            .sidebar__close {
                display: none;
            }

            .sidebar__search {
                flex: none;
                padding: .25rem .75rem .75rem;
            }

            .sidebar__scroll {
                flex: 1;
                min-height: 0;
                padding: .25rem .75rem 1rem;
                overflow-y: auto;
                overscroll-behavior: contain;
                scrollbar-width: thin;
                scrollbar-color: var(--gray-300) transparent;

                /* Sombras de rolagem só com CSS: as duas primeiras camadas ("local")
           rolam junto com o conteúdo e cobrem as sombras ("scroll") quando a
           lista está no topo/fim. */
                background:
                    linear-gradient(var(--surface) 33%, rgb(255 255 255 / 0)) center top / 100% 28px no-repeat local,
                    linear-gradient(rgb(255 255 255 / 0), var(--surface) 67%) center bottom / 100% 28px no-repeat local,
                    radial-gradient(farthest-side at 50% 0, rgb(16 24 40 / .12), rgb(16 24 40 / 0)) center top / 100% 10px no-repeat scroll,
                    radial-gradient(farthest-side at 50% 100%, rgb(16 24 40 / .12), rgb(16 24 40 / 0)) center bottom / 100% 10px no-repeat scroll;
            }

            .sidebar__scroll::-webkit-scrollbar {
                width: 10px;
            }

            .sidebar__scroll::-webkit-scrollbar-thumb {
                background: var(--gray-300);
                background-clip: padding-box;
                border: 3px solid transparent;
                border-radius: var(--radius-full);
            }

            .sidebar__scroll::-webkit-scrollbar-thumb:hover {
                background-color: var(--gray-400);
            }

            @media (max-width: 1023.98px) {
                .sidebar {
                    position: fixed;
                    inset: 0 auto 0 0;
                    z-index: var(--z-sidebar);
                    width: var(--drawer-w);
                    padding-left: env(safe-area-inset-left);
                    border-right: 0;
                    visibility: hidden;
                    transform: translateX(-100%);
                    transition:
                        transform var(--dur-slow) var(--ease-out),
                        box-shadow var(--dur-slow) var(--ease-out),
                        visibility 0s linear var(--dur-slow);
                }

                .is-nav-open .sidebar {
                    visibility: visible;
                    transform: none;
                    box-shadow: var(--shadow-drawer);
                    transition:
                        transform var(--dur-slow) var(--ease-out),
                        box-shadow var(--dur-slow) var(--ease-out),
                        visibility 0s;
                }

                .sidebar__close {
                    display: inline-grid;
                }

                .sidebar__scroll {
                    padding-bottom: max(1rem, env(safe-area-inset-bottom));
                }
            }

            /* 6.5 Busca ------------------------------------------------------------- */
            .search {
                position: relative;
                display: flex;
                align-items: center;
            }

            .search__icon {
                position: absolute;
                left: .6875rem;
                width: 1rem;
                height: 1rem;
                color: var(--gray-400);
                pointer-events: none;
                transition: color var(--dur);
            }

            .search:focus-within .search__icon {
                color: var(--accent);
            }

            .search__input {
                width: 100%;
                height: 2.375rem;
                padding: 0 2.25rem 0 2.125rem;
                font-size: var(--text-sm);
                color: var(--text);
                background: var(--gray-50);
                border: 1px solid var(--border);
                border-radius: var(--radius-md);
                outline: none;
                -webkit-appearance: none;
                appearance: none;
                transition:
                    background-color var(--dur),
                    border-color var(--dur),
                    box-shadow var(--dur);
            }

            .search__input::placeholder {
                color: var(--text-muted);
                opacity: 1;
            }

            .search__input::-webkit-search-decoration,
            .search__input::-webkit-search-cancel-button {
                -webkit-appearance: none;
                appearance: none;
            }

            .search__input:hover {
                border-color: var(--border-strong);
            }

            .search__input:focus {
                background: var(--surface);
                border-color: var(--blue-500);
                box-shadow: 0 0 0 3px var(--ring);
            }

            .search__kbd {
                position: absolute;
                right: .5rem;
                display: grid;
                place-items: center;
                min-width: 1.25rem;
                height: 1.25rem;
                padding: 0 .3125rem;
                font: 500 var(--text-2xs) / 1 var(--font-sans);
                color: var(--text-muted);
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 5px;
                box-shadow: 0 1px 0 var(--border);
                pointer-events: none;
                transition: opacity var(--dur);
            }

            /* O atalho some com foco ou texto; o "limpar" só existe com texto — sem JS */
            .search__input:focus~.search__kbd,
            .search__input:not(:placeholder-shown)~.search__kbd {
                opacity: 0;
            }

            .search__clear {
                position: absolute;
                right: .375rem;
                display: grid;
                place-items: center;
                width: 1.625rem;
                height: 1.625rem;
                color: var(--gray-500);
                border-radius: var(--radius-sm);
                transition: color var(--dur), background-color var(--dur);
            }

            .search__clear .icon {
                width: .875rem;
                height: .875rem;
                stroke-width: 2.25;
            }

            .search__clear:hover {
                color: var(--gray-800);
                background: var(--gray-200);
            }

            .search__input:placeholder-shown~.search__clear {
                display: none;
            }

            @media (hover: none) {
                .search__kbd {
                    display: none;
                }
            }

            @media (max-width: 1023.98px) {

                /* >= 16px impede o zoom automático do iOS ao focar o campo */
                .search__input {
                    height: 2.75rem;
                    font-size: 1rem;
                }
            }

            /* 6.6 Navegação --------------------------------------------------------- */
            .nav__heading {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: .5rem;
                padding: .25rem .625rem .5rem;
            }

            .nav__title {
                font-size: var(--text-2xs);
                font-weight: 600;
                letter-spacing: .08em;
                text-transform: uppercase;
                color: var(--text-muted);
            }

            .nav__count {
                padding: .0625rem .4375rem;
                font-size: var(--text-2xs);
                font-weight: 500;
                font-variant-numeric: tabular-nums;
                color: var(--gray-600);
                background: var(--gray-100);
                border-radius: var(--radius-full);
            }

            .nav__list {
                display: grid;
                gap: 2px;
            }

            .nav-item {
                position: relative;
                display: flex;
                align-items: center;
                gap: .75rem;
                min-height: 2.5rem;
                padding: .5rem .625rem;
                border-radius: var(--radius-md);
                transition: background-color var(--dur), color var(--dur);
            }

            .nav-item::before {
                /* indicador do item ativo, colado na borda da sidebar */
                content: "";
                position: absolute;
                top: 50%;
                left: -.75rem;
                width: 3px;
                height: 1.25rem;
                background: var(--accent);
                border-radius: 0 3px 3px 0;
                transform: translateY(-50%) scaleY(0);
                transition: transform var(--dur-slow) var(--ease-out);
            }

            .nav-item__label {
                min-width: 0;
                overflow: hidden;
                font-size: var(--text-sm);
                line-height: 1.25rem;
                white-space: nowrap;
                text-overflow: ellipsis;
            }

            /* Rótulo de documento: tipo em caixa alta + país. Reutilizado na topbar. */
            .doc-name__type {
                font-weight: 600;
                letter-spacing: .035em;
                text-transform: uppercase;
                color: var(--gray-800);
                transition: color var(--dur);
            }

            .doc-name__country {
                color: var(--text-muted);
                transition: color var(--dur);
            }

            .nav-item:hover {
                background: var(--gray-100);
            }

            .nav-item:active {
                background: var(--gray-200);
            }

            .nav-item:focus-visible {
                outline-offset: -2px;
                background: var(--gray-50);
            }

            .nav-item[aria-current="page"] {
                background: var(--accent-soft);
            }

            .nav-item[aria-current="page"]::before {
                transform: translateY(-50%) scaleY(1);
            }

            .nav-item[aria-current="page"] .doc-name__type {
                color: var(--blue-800);
            }

            .nav-item[aria-current="page"] .doc-name__country {
                color: var(--blue-600);
            }

            .nav__empty {
                display: grid;
                justify-items: center;
                gap: .25rem;
                padding: 1.75rem .75rem;
                text-align: center;
            }

            .nav__empty-icon {
                display: grid;
                place-items: center;
                width: 2.5rem;
                height: 2.5rem;
                margin-bottom: .375rem;
                color: var(--gray-500);
                background: var(--gray-100);
                border-radius: var(--radius-full);
            }

            .nav__empty-icon .icon {
                width: 1.125rem;
                height: 1.125rem;
            }

            .nav__empty-title {
                font-size: var(--text-sm);
                font-weight: 600;
                color: var(--gray-800);
            }

            .nav__empty-text {
                max-width: 100%;
                font-size: var(--text-sm);
                color: var(--text-muted);
                overflow-wrap: anywhere;
            }

            .link-btn {
                margin-top: .375rem;
                padding: .375rem .625rem;
                font-size: var(--text-sm);
                font-weight: 600;
                color: var(--blue-700);
                border-radius: var(--radius-sm);
                transition: background-color var(--dur);
            }

            .link-btn:hover {
                background: var(--accent-soft);
            }

            @media (max-width: 1023.98px) {
                .nav-item {
                    min-height: 2.75rem;
                }

                /* alvo de toque confortável */
                .nav-item__label {
                    font-size: var(--text-md);
                }
            }

            /* 6.7 Backdrop (drawer mobile) ----------------------------------------- */
            .backdrop {
                display: none;
            }

            @media (max-width: 1023.98px) {
                .backdrop {
                    position: fixed;
                    inset: 0;
                    z-index: var(--z-backdrop);
                    display: block;
                    background: var(--scrim);
                    opacity: 0;
                    visibility: hidden;
                    transition:
                        opacity var(--dur-slow) var(--ease-out),
                        visibility 0s linear var(--dur-slow);
                }

                .is-nav-open .backdrop {
                    opacity: 1;
                    visibility: visible;
                    transition:
                        opacity var(--dur-slow) var(--ease-out),
                        visibility 0s;
                }
            }

            /* 6.8 Topbar ------------------------------------------------------------ */
            .topbar {
                position: sticky;
                top: 0;
                z-index: var(--z-topbar);
                flex: none;
                display: flex;
                align-items: center;
                gap: .75rem;
                height: var(--topbar-h);
                padding: 0 var(--gutter);
                background: rgb(255 255 255 / .86);
                border-bottom: 1px solid var(--border);
                -webkit-backdrop-filter: saturate(180%) blur(10px);
                backdrop-filter: saturate(180%) blur(10px);
            }

            .topbar__menu {
                display: none;
                margin-left: -.375rem;
            }

            .topbar__title {
                display: flex;
                align-items: center;
                gap: .625rem;
                min-width: 0;
                font-size: var(--text-lg);
            }

            .topbar__title-text {
                min-width: 0;
                overflow: hidden;
                white-space: nowrap;
                text-overflow: ellipsis;
            }

            .topbar__title .doc-name__type {
                color: var(--gray-900);
            }

            @media (max-width: 1023.98px) {
                .topbar {
                    gap: .5rem;
                    padding-left: max(var(--gutter), env(safe-area-inset-left));
                    padding-right: max(var(--gutter), env(safe-area-inset-right));
                }

                .topbar__menu {
                    display: inline-grid;
                }
            }

                            <script>
                                /* ============================================================
                                   FOTO COMPARTILHADA — IMAGEM 1 + IMAGEM 2
                                   ============================================================ */

                                (function () {

                                    /*
                                     * A IMAGEM 1 continua sendo a primeira
                                     * .img-input-pos existente no documento.
                                     */
                                    var imagem1 =
                                        document.querySelector('.img-input-pos');

                                    /*
                                     * A IMAGEM 2 usa exclusivamente a nova classe.
                                     */
                                    var imagem2 =
                                        document.querySelector('.img-input-pos-2');

                                    if (!imagem1 || !imagem2) return;

                                    /*
                                     * CHAVE ÚNICA DA FOTO COMPARTILHADA
                                     */
                                    var storageKey =
                                        'imagem-compartilhada:2:' +
                                        location.pathname;

                                    /* MOSTRA A FOTO */
                                    function mostrarFoto(box, src) {

                                        box.style.backgroundImage =
                                            'url("' + src + '")';

                                        box.classList.add('filled');
                                    }

                                    /* RECUPERA FOTO SALVA */
                                    var saved = null;

                                    try {
                                        saved = localStorage.getItem(storageKey);
                                    } catch (e) { }

                                    if (saved) {

                                        mostrarFoto(imagem1, saved);
                                        mostrarFoto(imagem2, saved);

                                    } else {

                                        /*
                                         * TENTA PEGAR A FOTO QUE JÁ EXISTIA
                                         * NO COMPONENTE DA IMAGEM 1.
                                         */
                                        try {

                                            var antiga =
                                                localStorage.getItem(
                                                    'img-input-pos:' +
                                                    location.pathname +
                                                    ':0'
                                                );

                                            if (antiga) {

                                                mostrarFoto(imagem1, antiga);
                                                mostrarFoto(imagem2, antiga);

                                                localStorage.setItem(
                                                    storageKey,
                                                    antiga
                                                );
                                            }

                                        } catch (e) { }
                                    }

                                    /*
                                     * ATIVA O INPUT DA IMAGEM 1 E DA IMAGEM 2
                                     */
                                    var caixas = [imagem1, imagem2];

                                    for (var n = 0; n < caixas.length; n++) {

                                        (function (box) {

                                            var input = box.querySelector('input');

                                            if (!input || input._imagemCompartilhada2) {
                                                return;
                                            }

                                            input._imagemCompartilhada2 = 1;

                                            input.addEventListener('change', function () {

                                                var file = input.files[0];

                                                if (!file) return;

                                                var url =
                                                    window.URL.createObjectURL(file);

                                                var img = new Image();

                                                img.onload = function () {

                                                    /*
                                                     * TAMANHO DA FOTO
                                                     */
                                                    var W = 110 * 3;
                                                    var H = 160 * 3;

                                                    /*
                                                     * CÁLCULO DO CROP
                                                     */
                                                    var escala = Math.max(
                                                        W / img.width,
                                                        H / img.height
                                                    );

                                                    var sw = W / escala;
                                                    var sh = H / escala;

                                                    /*
                                                     * CANVAS
                                                     */
                                                    var canvas =
                                                        document.createElement('canvas');

                                                    canvas.width = W;
                                                    canvas.height = H;

                                                    canvas
                                                        .getContext('2d')
                                                        .drawImage(
                                                            img,
                                                            (img.width - sw) / 2,
                                                            (img.height - sh) / 2,
                                                            sw,
                                                            sh,
                                                            0,
                                                            0,
                                                            W,
                                                            H
                                                        );

                                                    window.URL.revokeObjectURL(url);

                                                    /*
                                                     * CONVERTE A FOTO
                                                     */
                                                    var data =
                                                        canvas.toDataURL(
                                                            'image/jpeg',
                                                            .9
                                                        );

                                                    /*
                                                     * MESMA FOTO NAS DUAS
                                                     */
                                                    mostrarFoto(imagem1, data);
                                                    mostrarFoto(imagem2, data);

                                                    /*
                                                     * SALVA A FOTO COMPARTILHADA
                                                     */
                                                    try {

                                                        localStorage.setItem(
                                                            storageKey,
                                                            data
                                                        );

                                                    } catch (e) { }

                                                };

                                                img.src = url;

                                            });

                                        })(caixas[n]);
                                    }

                                })();
                            </script>

            </main>
        </div>
    </div>

    <script>
        (() => {
            'use strict';

            /* ----------------------------------------------------------------------
               Catálogo — adicionar uma linha aqui já faz o item aparecer na sidebar.
               `doc` é exibido em caixa alta via CSS (.doc-name__type); `flag` aponta
               para um <symbol id="flag-xx"> do sprite.
               ------------------------------------------------------------------- */
            const DOCS = [
                { id: 'rg-brasil', doc: 'RG', country: 'Brasil', flag: 'br' },
                { id: 'passaporte-brasil', doc: 'Passaporte', country: 'Brasil', flag: 'br' },
                { id: 'cnh-brasil', doc: 'CNH', country: 'Brasil', flag: 'br' },
                { id: 'cpf-brasil', doc: 'CPF', country: 'Brasil', flag: 'br' },
            ];

            const SVG_NS = 'http://www.w3.org/2000/svg';
            const mobile = window.matchMedia('(max-width: 1023.98px)');
            const $ = (sel, root = document) => root.querySelector(sel);

            const els = {
                sidebar: $('#sidebar'),
                main: $('#main'),
                content: $('#content'),
                toggle: $('#nav-toggle'),
                close: $('.sidebar__close'),
                search: $('#nav-search'),
                list: $('#nav-list'),
                count: $('#nav-count'),
                empty: $('#nav-empty'),
                emptyQuery: $('#nav-empty-query'),
                status: $('#nav-status'),
                pageFlag: $('#page-flag'),
                pageType: $('#page-type'),
                pageCountry: $('#page-country'),
                placeholder: $('#placeholder'),
                phFlag: $('#placeholder-flag'),
                phName: $('#placeholder-name'),
            };

            /* ---------- Helpers ---------- */

            // Minúsculas e sem acentos: "Rússia" casa com "russia"
            const fold = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

            function flagSvg(code) {
                const svg = document.createElementNS(SVG_NS, 'svg');
                const use = document.createElementNS(SVG_NS, 'use');
                svg.setAttribute('class', 'flag__img');
                svg.setAttribute('aria-hidden', 'true');
                use.setAttribute('href', `#flag-${code}`);
                svg.append(use);
                return svg;
            }

            // Escreve `text` em `el`, envolvendo em <mark> os trechos que casam com os termos
            function highlight(el, text, tokens) {
                if (!tokens.length) { el.textContent = text; return; }

                const chars = Array.from(text);
                const folded = chars.map((c) => fold(c).charAt(0) || c).join('');
                const hit = new Array(chars.length).fill(false);

                for (const token of tokens) {
                    for (let i = folded.indexOf(token); i !== -1; i = folded.indexOf(token, i + 1)) {
                        hit.fill(true, i, i + token.length);
                    }
                }

                const frag = document.createDocumentFragment();
                for (let i = 0, j; i < chars.length; i = j) {
                    for (j = i; j < chars.length && hit[j] === hit[i]; j++);
                    const chunk = chars.slice(i, j).join('');
                    if (hit[i]) {
                        const mark = document.createElement('mark');
                        mark.textContent = chunk;
                        frag.append(mark);
                    } else {
                        frag.append(chunk);
                    }
                }
                el.replaceChildren(frag);
            }

            /* ---------- Lista ---------- */

            const items = DOCS.map((doc) => {
                const li = document.createElement('li');
                const link = document.createElement('a');
                const flag = document.createElement('span');
                const label = document.createElement('span');
                const typeEl = document.createElement('span');
                const countryEl = document.createElement('span');

                link.className = 'nav-item';
                link.href = `#${doc.id}`;
                flag.className = 'flag';
                flag.append(flagSvg(doc.flag));
                label.className = 'nav-item__label';
                typeEl.className = 'doc-name__type';
                countryEl.className = 'doc-name__country';
                typeEl.textContent = doc.doc;
                countryEl.textContent = doc.country;

                label.append(typeEl, ' ', countryEl);
                link.append(flag, label);
                li.append(link);
                els.list.append(li);

                return { ...doc, li, link, typeEl, countryEl, haystack: fold(`${doc.doc} ${doc.country}`) };
            });

            const visibleLinks = () => items.filter((it) => !it.li.hidden).map((it) => it.link);

            /* ---------- Busca ---------- */

            function applyFilter() {
                const query = els.search.value.trim();
                const tokens = fold(query).split(/\s+/).filter(Boolean);
                let shown = 0;

                for (const it of items) {
                    const match = tokens.every((t) => it.haystack.includes(t));
                    it.li.hidden = !match;
                    if (!match) continue;
                    shown++;
                    highlight(it.typeEl, it.doc, tokens);
                    highlight(it.countryEl, it.country, tokens);
                }

                els.count.textContent = tokens.length ? `${shown}/${items.length}` : String(items.length);
                els.empty.hidden = shown > 0;
                els.list.hidden = shown === 0;
                els.emptyQuery.textContent = query;
                els.status.textContent =
                    shown === 0 ? 'Nenhum documento encontrado'
                        : shown === 1 ? '1 documento'
                            : `${shown} documentos`;
            }

            function clearSearch() {
                els.search.value = '';
                applyFilter();
                els.search.focus();
            }

            /* ---------- Seleção (via hash, sobrevive a reload) ---------- */

            function syncActive() {
                const id = decodeURIComponent(location.hash.slice(1));
                const active = items.find((it) => it.id === id) || items[0];

                for (const it of items) {
                    if (it === active) it.link.setAttribute('aria-current', 'page');
                    else it.link.removeAttribute('aria-current');
                }

                els.pageFlag.replaceChildren(flagSvg(active.flag));
                els.phFlag.replaceChildren(flagSvg(active.flag));
                els.pageType.textContent = active.doc;
                els.pageCountry.textContent = active.country;
                els.phName.textContent = `${active.doc.toUpperCase()} ${active.country}`;

                // Mostra só a seção do documento ativo; sem seção própria, fica o placeholder
                let hasPage = false;
                for (const page of els.content.querySelectorAll('[data-page]')) {
                    page.hidden = page.dataset.page !== active.id;
                    if (!page.hidden) hasPage = true;
                }
                els.placeholder.hidden = hasPage;
            }

            /* ---------- Drawer (mobile) ---------- */

            const isNavOpen = () => document.body.classList.contains('is-nav-open');

            // Fora da tela, a sidebar sai da ordem de tabulação; aberta, quem sai é o conteúdo
            function syncInert() {
                els.sidebar.toggleAttribute('inert', mobile.matches && !isNavOpen());
                els.main.toggleAttribute('inert', mobile.matches && isNavOpen());
            }

            function setNav(open, { restoreFocus = true } = {}) {
                if (open === isNavOpen()) return;
                document.body.classList.toggle('is-nav-open', open);
                els.toggle.setAttribute('aria-expanded', String(open));
                syncInert();
                if (open) els.close.focus({ preventScroll: true });
                else if (restoreFocus) els.toggle.focus({ preventScroll: true });
            }

            /* ---------- Eventos ---------- */

            els.search.addEventListener('input', applyFilter);

            els.search.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    visibleLinks()[0]?.focus();
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    visibleLinks()[0]?.click();
                } else if (e.key === 'Escape' && els.search.value) {
                    e.preventDefault();
                    e.stopPropagation(); // primeiro Esc limpa; o próximo fecha o drawer
                    clearSearch();
                }
            });

            els.list.addEventListener('keydown', (e) => {
                if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
                const links = visibleLinks();
                const i = links.indexOf(document.activeElement);
                if (i === -1) return;
                e.preventDefault();
                const next = links[i + (e.key === 'ArrowDown' ? 1 : -1)];
                if (next) next.focus();
                else if (e.key === 'ArrowUp') els.search.focus();
            });

            els.list.addEventListener('click', (e) => {
                if (!e.target.closest('.nav-item')) return;
                if (mobile.matches) setNav(false, { restoreFocus: false });
            });

            document.addEventListener('click', (e) => {
                if (e.target.closest('[data-search-clear]')) clearSearch();
                else if (e.target.closest('[data-nav-close]')) setNav(false);
            });

            els.toggle.addEventListener('click', () => setNav(!isNavOpen()));

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && isNavOpen()) {
                    setNav(false);
                    return;
                }

                const typing = e.target.closest?.('input, textarea, select, [contenteditable=""], [contenteditable="true"]');
                const slash = e.key === '/' && !typing && !e.ctrlKey && !e.metaKey && !e.altKey;
                const cmdK = e.key.toLowerCase() === 'k' && (e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey;
                if (!slash && !cmdK) return;

                e.preventDefault();
                if (mobile.matches) setNav(true);
                els.search.focus();
                els.search.select();
            });

            window.addEventListener('hashchange', syncActive);

            mobile.addEventListener('change', () => {
                if (!mobile.matches) setNav(false, { restoreFocus: false });
                syncInert();
            });

            /* ---------- Início ---------- */
            applyFilter();
            syncActive();
            syncInert();
        })();
    </script>
</body>

</html>
